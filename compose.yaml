services:
  db:
    image: mysql:8.4
    container_name: baozi-db
    environment:
        MYSQL_ROOT_PASSWORD: Jw26946346fFTe
        MYSQL_DATABASE: pedidos_db
    ports:
        - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql

    networks:
      - baozi_net

networks:
  baozi_net:
    driver: bridge

volumes:
  mysql_data: